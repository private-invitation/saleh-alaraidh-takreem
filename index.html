<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>دعوة خاصة</title>
<style>
@font-face{font-family:Thmanyah;src:url(thmanyah-regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Thmanyah;src:url(thmanyah-bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--gold:#7F6224;--gold2:#A0803F;--ink:#1A1915;--paper:#FFFFFF;--card:#F3F0E9;--line:#E2DACB;--mute:#6B655C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:Thmanyah,system-ui,sans-serif}
body{min-height:100vh;padding:28px 16px 40px;display:flex;justify-content:center}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
h1{font-size:30px;font-weight:700;color:var(--gold);text-align:center;line-height:1.3}
.sub{font-size:16px;color:var(--mute);text-align:center;margin-top:-8px}
label{display:block;font-size:16px;font-weight:700;color:var(--gold);margin-bottom:8px}
input{width:100%;font:inherit;font-size:21px;font-weight:700;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;outline:none;direction:rtl}
input:focus{border-color:var(--gold2)}
input::placeholder{color:#A9A296;font-weight:400}
.fn{font-size:14px;color:var(--gold);margin-top:8px;min-height:22px}
.prev{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;aspect-ratio:9/16;box-shadow:0 6px 24px rgba(60,45,15,.08)}
.prev canvas{display:block;width:100%;height:100%}
.prev .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--gold);background:#fff}
button{font:inherit;font-size:21px;font-weight:700;width:100%;border:0;border-radius:14px;padding:15px;cursor:pointer;background:var(--gold);color:#fff}
button:disabled{opacity:.35;cursor:default}
.note{font-size:14px;color:var(--mute);text-align:center;line-height:1.8}
.msg{font-size:16px;text-align:center;color:var(--gold);min-height:24px}
.sticky{position:sticky;bottom:12px;display:flex;flex-direction:column;gap:8px;background:var(--paper);padding-top:4px}
</style>
</head>
<body>
<main>
  <h1>دعوة خاصة</h1>
  <p class="sub">حفل تكريم الكابتن صالح العريض<br>اكتب اسم المدعو واضغط «إرسال»</p>

  <div>
    <label for="nm">اسم المدعو</label>
    <input id="nm" type="text" autocomplete="off" maxlength="60" placeholder="اكتب الاسم هنا">
    <div class="fn" id="fn"></div>
  </div>

  <div class="sticky">
    <button id="send" disabled>إرسال</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="prev"><canvas id="cv" width="2160" height="3840"></canvas><div class="wait" id="wait">جاري التحميل…</div></div>
  <p class="note">بالجوال: تفتح لك خيارات المشاركة (واتساب وغيره) والدعوة PDF باسم المدعو.<br>بالكمبيوتر: ينزل ملف PDF باسمه.<br>الباركود داخل الـPDF قابل للضغط لتأكيد الحضور.</p>
</main>

<script src="jspdf.umd.min.js"></script>
<script>
const W=2160,H=3840;
const RSVP='https://event.esol.sa/r/0tXcecrAfLyDHgmjCbm9Z37Glzr4gfIQwl03Qecj';
// empty slot between «دعوة خاصة» (ink ends y=626) and the card (top y=1056)
const PX=1080,PY=840,PMAX=1640;
const FONT='Thmanyah';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const nm=document.getElementById('nm'),btn=document.getElementById('send'),msg=document.getElementById('msg');
const base=new Image();
let ready=false,cache={name:null,file:null},timer=null;

function clean(s){return s.replace(/\s+/g,' ').trim()}
function fileName(n){return n.replace(/[\\/:*?"<>|]/g,'').trim()+'.pdf'}

function draw(n){
  ctx.drawImage(base,0,0,W,H);
  if(!n)return;
  let size=110;
  ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  do{ctx.font='700 '+size+'px '+FONT;if(ctx.measureText(n).width<=PMAX)break;size-=2}while(size>40);
  // centre the real ink of this name on PY
  const m=ctx.measureText(n);
  const asc=m.actualBoundingBoxAscent||size*0.62, desc=m.actualBoundingBoxDescent||size*0.28;
  ctx.fillStyle='#1A1915';
  ctx.fillText(n,PX,PY+(asc-desc)/2);
}

function build(n){
  draw(n);
  const url=cv.toDataURL('image/jpeg',0.9);
  const doc=new jspdf.jsPDF({orientation:'portrait',unit:'pt',format:[540,960],compress:true});
  doc.setProperties({title:n,subject:'دعوة خاصة — حفل تكريم الكابتن صالح العريض'});
  doc.addImage(url,'JPEG',0,0,540,960,undefined,'FAST');
  // QR + «لتأكيد حضوركم» area (2160px image = 540pt, 4px per pt)
  doc.link(40,715,135,125,{url:RSVP});
  const blob=doc.output('blob');
  const fn=fileName(n);
  cache={name:n,file:new File([blob],fn,{type:'application/pdf'})};
  return cache.file;
}

function download(file){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(file);a.download=file.name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

nm.addEventListener('input',()=>{
  const n=clean(nm.value);
  btn.disabled=!ready||!n;msg.textContent='';
  document.getElementById('fn').textContent=n?('اسم الملف: '+fileName(n)):'';
  if(!ready)return;
  draw(n);
  clearTimeout(timer);
  if(n)timer=setTimeout(()=>build(n),350);
});

btn.addEventListener('click',async()=>{
  const n=clean(nm.value);if(!n||!ready)return;
  clearTimeout(timer);
  const file=(cache.name===n&&cache.file)?cache.file:build(n);
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
  if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});msg.textContent='تم ✓ اكتب اسم المدعو التالي';nm.value='';draw('');btn.disabled=true;document.getElementById('fn').textContent='';nm.focus()}
    catch(e){if(e&&e.name==='AbortError')return;download(file);msg.textContent='تم تنزيل '+file.name}
  }else{download(file);msg.textContent='تم تنزيل '+file.name}
});

Promise.all([
  new Promise((res,rej)=>{base.onload=res;base.onerror=rej;base.src='base.jpg'}),
  document.fonts.load('700 100px '+FONT,'محمد العتيبي').catch(()=>{})
]).then(()=>{
  ready=true;document.getElementById('wait').remove();
  const n=clean(nm.value);draw(n);btn.disabled=!n;if(n)build(n);
}).catch(()=>{document.getElementById('wait').textContent='تعذر تحميل الدعوة، حدّث الصفحة'});
</script>
</body>
</html>
